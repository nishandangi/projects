<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crypto Futures Dashboard</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #131722;
    color: white;
    font-family: Arial, sans-serif;
}

/* Header: slot selector + pair buttons */
.topbar {
    width: 100%;
    padding: 6px 3px;
    background: #1e222d;
    border-bottom: 1px solid #363c4e;
    display: flex;
    align-items: flex-start;
    gap: 8px;
}

.slot-bar {
    display: flex;
    gap: 5px;
    flex: 0 0 auto;
}

.pair-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 2px;
    flex: 1 1 0;
    min-width: 0;
}

.pair-btn,
.slot-chip {
    padding: 7px 10px;
    border: 1px solid #363c4e;
    border-radius: 4px;
    background: #131722;
    color: #d1d4dc;
    cursor: pointer;
    font-size: 12px;
    font-weight: bold;
}

.pair-btn:hover {
    border-color: #2962ff;
}

.slot-chip:hover {
    background: #2a2e39;
}

/* Slot colors: 1 blue, 2 orange, 3 teal, 4 purple */
.slot-chip.s0 { border-left: 4px solid #2962ff; }
.slot-chip.s1 { border-left: 4px solid #ff9800; }
.slot-chip.s2 { border-left: 4px solid #26a69a; }
.slot-chip.s3 { border-left: 4px solid #ab47bc; }

.slot-chip.target {
    background: #2a2e39;
    color: white;
    box-shadow: inset 0 0 0 1px #d1d4dc;
}

.pair-btn.s0 { background: #2962ff; border-color: #2962ff; color: white; }
.pair-btn.s1 { background: #ff9800; border-color: #ff9800; color: #131722; }
.pair-btn.s2 { background: #26a69a; border-color: #26a69a; color: #131722; }
.pair-btn.s3 { background: #ab47bc; border-color: #ab47bc; color: white; }

/* 2 x 2 chart grid */
.dashboard {
    --dash-h: calc(100dvh - var(--topbar-height, 60px));
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 3px;
    width: 100%;
    height: var(--dash-h);
    padding: 3px;
}

.chart-box {
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
}

.chart-container {
    width: 100%;
    height: 100%;
}

.tradingview-widget-container,
.tradingview-widget-container__widget {
    width: 100%;
    height: 100%;
}

/* Mobile layout: one column, each chart half a screen, scroll for the rest */
@media (max-width: 768px) {
    .topbar {
        flex-wrap: wrap;
    }

    .pair-buttons {
        flex: 1 1 100%;
    }

    .pair-btn,
    .slot-chip {
        padding: 6px 8px;
    }

    .dashboard {
        grid-template-columns: 1fr;
        grid-template-rows: repeat(4, calc(var(--dash-h) / 2));
        overflow-y: auto;
    }
}
</style>
</head>

<body>

<header class="topbar">
    <div id="slotBar" class="slot-bar"></div>
    <nav id="pairButtons" class="pair-buttons"></nav>
</header>

<main class="dashboard" id="dashboard">
    <section class="chart-box"><div class="chart-container" id="chart0"></div></section>
    <section class="chart-box"><div class="chart-container" id="chart1"></div></section>
    <section class="chart-box"><div class="chart-container" id="chart2"></div></section>
    <section class="chart-box"><div class="chart-container" id="chart3"></div></section>
</main>

<script>

const CFG = {
    exchange: "BINANCE",
    interval: "1",          // all 4 charts use the 1m timeframe

    defaults: ["BTCUSDT", "ETHUSDT", "ZECUSDT", "HYPEUSDT"],

    symbols: [
        "AAVEUSDT",
        "ADAUSDT",
        "AVAXUSDT",
        "BCHUSDT",
        "BNBUSDT",
        "BTCUSDT",
        "BTWUSDT",
        "DOTUSDT",
        "ETCUSDT",
        "ETHUSDT",
        "FILUSDT",
        "HYPEUSDT",
        "LINKUSDT",
        "LTCUSDT",
        "NEARUSDT",
        "SOLUSDT",
        "SUIUSDT",
        "TAOUSDT",
        "TRXUSDT",
        "UNIUSDT",
        "XLMUSDT",
        "XMRUSDT",
        "XRPUSDT",
        "ZECUSDT"
    ]
};

const SLOT_COUNT = 4;

// App state
// symbols : pair shown in each of the 4 charts
// target  : chart that the next pair-button click will fill
const state = {
    symbols: CFG.defaults.slice(),
    target: 0
};

// What each chart currently shows (avoids reloading unchanged charts)
const rendered = [];

const pairButtons = document.getElementById("pairButtons");
const slotBar = document.getElementById("slotBar");

// Short button names
function displayName(symbol) {
    return symbol.replace(/USDT$/i, "");
}

// "btcusdt.p" -> "BTCUSDT" (or null if unknown)
function normalize(raw) {
    if (!raw) return null;
    const symbol = raw.trim().toUpperCase().replace(/\.P$/, "");
    return CFG.symbols.includes(symbol) ? symbol : null;
}

// URL format: ?pairs=btcusdt.p,ethusdt.p,zecusdt.p,hypeusdt.p
function updateUrl() {
    const url = new URL(location.href);

    url.searchParams.delete("pair");
    url.searchParams.delete("pair2");
    url.searchParams.set(
        "pairs",
        state.symbols.map(s => s.toLowerCase() + ".p").join(",")
    );

    history.pushState({ pairs: state.symbols.slice() }, "", url);
}

// Read the 4 pairs from URL; missing/invalid ones fall back to defaults
function loadStateFromUrl() {
    const raw = new URLSearchParams(location.search).get("pairs") || "";
    const list = [];

    raw.split(",").forEach(item => {
        const symbol = normalize(item);
        if (symbol && !list.includes(symbol)) list.push(symbol);
    });

    CFG.defaults.concat(CFG.symbols).forEach(symbol => {
        if (list.length < SLOT_COUNT && !list.includes(symbol)) list.push(symbol);
    });

    state.symbols = list.slice(0, SLOT_COUNT);
}

// Render one TradingView chart
function renderChart(index, force) {

    const symbol = state.symbols[index];

    if (!force && rendered[index] === symbol) return;
    rendered[index] = symbol;

    const container = document.getElementById("chart" + index);

    container.innerHTML = "";

    const widgetContainer = document.createElement("div");
    widgetContainer.className = "tradingview-widget-container";
    widgetContainer.style.width = "100%";
    widgetContainer.style.height = "100%";

    const widget = document.createElement("div");
    widget.className = "tradingview-widget-container__widget";

    widgetContainer.appendChild(widget);

    const script = document.createElement("script");
    script.type = "text/javascript";
    script.async = true;
    script.src =
        "https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js";

    script.textContent = JSON.stringify({
        autosize: true,
        symbol: `${CFG.exchange}:${symbol}.P`,
        interval: CFG.interval,
        timezone: "Etc/UTC",
        theme: "dark",
        style: "1",
        locale: "en",
        allow_symbol_change: true,
        hide_side_toolbar: false,
        hide_top_toolbar: false,
        hide_legend: false,
        hide_volume: false,
        withdateranges: true,
        save_image: true,
        support_host: "https://www.tradingview.com"
    });

    widgetContainer.appendChild(script);
    container.appendChild(widgetContainer);
}

// Sync the whole UI with `state`
function applyState(forceSlots = []) {

    state.symbols.forEach((symbol, i) => {
        const chip = slotBar.children[i];

        chip.textContent = `${i + 1}: ${displayName(symbol)}`;
        chip.classList.toggle("target", state.target === i);
    });

    document.querySelectorAll(".pair-btn").forEach(button => {
        const slot = state.symbols.indexOf(button.dataset.symbol);

        for (let i = 0; i < SLOT_COUNT; i++) {
            button.classList.toggle("s" + i, slot === i);
        }
    });

    for (let i = 0; i < SLOT_COUNT; i++) {
        renderChart(i, forceSlots.includes(i));
    }

    updateDashboardHeight();
}

// Select trading pair: fills the target chart
function selectPair(symbol) {

    if (!CFG.symbols.includes(symbol)) return;

    const target = state.target;
    const other = state.symbols.indexOf(symbol);

    if (other === -1) {
        state.symbols[target] = symbol;
        applyState([target]);
    } else if (other === target) {
        applyState([target]);                // same pair: reload that chart
    } else {
        // Pair is already in another chart -> swap the two charts
        state.symbols[other] = state.symbols[target];
        state.symbols[target] = symbol;
        applyState([target, other]);
    }

    updateUrl();
}

// Generate slot chips (1-4)
for (let i = 0; i < SLOT_COUNT; i++) {

    const chip = document.createElement("button");

    chip.type = "button";
    chip.className = "slot-chip s" + i;
    chip.title = `Next pair you click goes to chart ${i + 1}`;

    chip.addEventListener("click", () => {
        state.target = i;
        applyState();
    });

    slotBar.appendChild(chip);
}

// Generate pair buttons
CFG.symbols.forEach(symbol => {

    const button = document.createElement("button");

    button.type = "button";
    button.className = "pair-btn";
    button.textContent = displayName(symbol);
    button.dataset.symbol = symbol;
    button.title = `${CFG.exchange}:${symbol}.P`;

    button.addEventListener("click", () => {
        selectPair(symbol);
    });

    pairButtons.appendChild(button);
});

// Dynamically calculate chart height
function updateDashboardHeight() {

    const topbar = document.querySelector(".topbar");

    document.documentElement.style.setProperty(
        "--topbar-height",
        `${topbar.getBoundingClientRect().height}px`
    );
}

window.addEventListener("resize", updateDashboardHeight);

if (window.ResizeObserver) {
    new ResizeObserver(updateDashboardHeight).observe(document.querySelector(".topbar"));
}

// Browser back/forward navigation
window.addEventListener("popstate", () => {
    loadStateFromUrl();
    applyState();
});

// Load initial state
loadStateFromUrl();
updateDashboardHeight();
applyState([0, 1, 2, 3]);

</script>

</body>
</html>
