<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>candle</title>
<style>
:root{--bg:#0b1220;--panel:rgba(20,30,50,.72);--panel2:rgba(28,40,64,.85);--line:rgba(120,140,180,.18);--text:#e6ebf5;--muted:#8b97ad;--up:#2ebd85;--dn:#f6465d;--accent:#f0b90b;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{min-height:100vh;color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(1200px 600px at 15% -10%,rgba(240,185,11,.08),transparent 60%),radial-gradient(900px 500px at 100% 0,rgba(46,189,133,.08),transparent 60%)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
button,select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:2px 5px;font:inherit;cursor:pointer;transition:border-color .15s,background .15s}
select{padding:7px 8px}
select option{background:#1c2840}
button:hover,select:hover{border-color:var(--muted)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:#1a1500;border-color:var(--accent);font-weight:600}
button.danger{color:var(--dn);border-color:rgba(246,70,93,.6)}
button.danger:hover{background:rgba(246,70,93,.12)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;border-radius:0;padding:7px 12px;color:var(--muted);background:transparent}
.seg button+button{border-left:1px solid var(--line)}
.seg button:hover{color:var(--text)}
.seg button:focus-visible{outline-offset:-3px}
.seg button[aria-pressed="true"]{background:rgba(120,140,180,.18);color:var(--text);box-shadow:inset 0 -2px 0 var(--accent)}
#state{color:var(--muted)}
#state.err{color:var(--dn)}
.layout{display:flex;gap:16px;align-items:flex-start}
.wrap{flex:1 1 0;min-width:0;overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 8px 30px rgba(0,0,0,.35)}
.side{flex:0 0 20%;min-width:100px;position:sticky;top:16px}
.side-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.side-head h2{margin:0}
.side-head button{padding:4px 4px;font-size:13px}
@media (max-width:900px){.layout{flex-direction:column}.side{flex:none;width:100%;position:static}}
table{border-collapse:collapse;width:100%;min-width:1150px}
.flat{color:var(--muted)}
.ext{color:var(--accent)}
th,td{padding:4px 3px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;font-variant-numeric:tabular-nums}
th{color:var(--muted);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.04em;background:var(--panel2);position:sticky;top:0}
tbody tr{transition:background .15s}
tbody tr:hover{background:rgba(120,140,180,.07)}
tr:last-child td{border-bottom:0}
.sym{font-weight:650}
td.sym{min-width:150px}
td.sym a{color:inherit;text-decoration:none}
td.sym a:hover{color:var(--accent);text-decoration:underline}
td.sym a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
td.sym .price{margin:2px 0 4px}
td.sym .status{font-weight:400}
.price{font-size:15px;font-weight:600}
.lab{display:flex;align-items:center;gap:6px;margin-bottom:2px;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block}
.g .dot{background:var(--up)}.g{color:var(--up)}
.r .dot{background:var(--dn)}.r{color:var(--dn)}
.lv{color:var(--muted)}.lv b{color:var(--text);font-weight:500}
.lv b.hit-up{color:var(--up);font-weight:700}
.lv b.hit-dn{color:var(--dn);font-weight:700}
.at{margin-left:6px;font-size:12px;font-weight:700;white-space:nowrap}
.at.up{color:var(--up)}.at.dn{color:var(--dn)}
.badge{display:inline-block;padding:2px 3px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.badge.up{color:var(--up);border-color:var(--up)}
.badge.dn{color:var(--dn);border-color:var(--dn)}
.badge.both{color:var(--accent);border-color:var(--accent)}
.badge.warn{color:var(--accent)}
.pos{color:var(--up)}.neg{color:var(--dn)}
.badge.strong{font-weight:700;background:rgba(255,255,255,.06)}
#viewToggle[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
body.only-match #rows tr:not(.m-up):not(.m-dn){display:none}
tr.m-up td.sym{box-shadow:inset 3px 0 0 var(--up)}
tr.m-dn td.sym{box-shadow:inset 3px 0 0 var(--dn)}
tr.m-up.m-dn td.sym{box-shadow:inset 3px 0 0 var(--accent)}
#noMatch{padding:14px 12px;color:var(--muted)}
td.levels{min-width:190px}
.lvrow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.lvrow:last-child{margin-bottom:0}
.lvrow .tag{flex:0 0 22px;height:22px;display:grid;place-items:center;border-radius:6px;font-size:11px;font-weight:700}
.lvrow.res .tag{background:rgba(46,189,133,.15);color:var(--up)}
.lvrow.sup .tag{background:rgba(246,70,93,.15);color:var(--dn)}
input.lvl{flex:1;min-width:0;width:130px;background:rgba(8,14,26,.7);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit;font-variant-numeric:tabular-nums}
.lvrow.res input.lvl:focus-visible{border-color:var(--up)}
.lvrow.sup input.lvl:focus-visible{border-color:var(--dn)}
input.lvl::placeholder{color:var(--muted)}
input.lvl:focus-visible{outline:none}
input.lvl.hit-up{border-color:var(--up);color:var(--up);background:rgba(46,189,133,.1)}
input.lvl.hit-dn{border-color:var(--dn);color:var(--dn);background:rgba(246,70,93,.1)}
tr.flash-up{animation:fu 3s ease-out}
tr.flash-dn{animation:fd 3s ease-out}
@keyframes fu{0%,30%{background:rgba(46,189,133,.28)}100%{background:transparent}}
@keyframes fd{0%,30%{background:rgba(246,70,93,.28)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){tr.flash-up,tr.flash-dn{animation:none}}
h2{font-size:15px;margin:20px 0 8px;font-weight:600}
#log{list-style:none;max-height:calc(100vh - 80px);overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#log li{padding:8px 10px;border-bottom:1px solid var(--line)}
#log li:last-child{border-bottom:0}
#log .empty{color:var(--muted)}
#log time{color:var(--muted);margin-right:8px}
</style>
</head>
<body>
<audio id="buySound" src="https://nishandangi.com.np/resources/audio/bsignal.mp3" preload="auto"></audio>
<audio id="sellSound" src="https://nishandangi.com.np/resources/audio/ssignal.mp3" preload="auto"></audio>

<div class="bar">
  <div class="seg" id="intervals" role="group" aria-label="Candle interval">
    <button type="button" data-iv="1d" aria-pressed="true">1d</button>
    <button type="button" data-iv="4h" aria-pressed="false">4h</button>
    <button type="button" data-iv="1h" aria-pressed="false">1h</button>
    <button type="button" data-iv="15m" aria-pressed="false">15m</button>
  </div>
  <select id="tz" aria-label="Time zone" title="Time zone: candles open at midnight of this zone, and all times are shown in it"></select>
  <button type="button" id="viewToggle" aria-pressed="false" title="Show only symbols whose running candle broke the previous high or low (active buy / sell alert)">View matches (0)</button>
  <button class="primary" id="enableBtn">Enable sound and notifications</button>
  <button id="testBuy" disabled>Test buy sound</button>
  <button id="testSell" disabled>Test sell sound</button>
  <button id="resetLevels" class="danger" type="button">Reset all support / resistance</button>
  <span id="state">Connecting…</span>
</div>

<div class="layout">
<div class="wrap">
<table>
  <thead><tr>
    <th>Symbol / Price / Status</th><th id="thPrev">Yesterday (closed)</th><th id="thCur">Today (running)</th><th>Trend</th><th title="OB = 70 or more (overbought), OS = 30 or less (oversold)">RSI (14)</th><th>MACD / Signal (12,26,9)</th><th>Resistance / Support</th>
  </tr></thead>
  <tbody id="rows"></tbody>
</table>
<div id="noMatch" hidden>No symbol meets the alert condition right now. Use Show all to see every row.</div>
</div>
<aside class="side">
<div class="side-head"><h2>Alert log</h2><button id="clearLog" type="button">Reset</button></div>
<ul id="log"><li class="empty">No alerts yet.</li></ul>
</aside>
</div>

<script>
const CFG = {
  symbols: ["BTCUSDT","HYPEUSDT","ZECUSDT","TLMUSDT","APTUSDT","XAUUSDT","NEARUSDT","ETHUSDT","SOLUSDT","BNBUSDT","TRXUSDT","XMRUSDT","BTWUSDT","LSKUSDT","LINKUSDT","AAVEUSDT","UNIUSDT","XRPUSDT","LTCUSDT","BCHUSDT","SUIUSDT","TAOUSDT"],
  interval: "1d",
  chart: "https://www.tradingview.com/chart/uEMj43E3/?symbol=BINANCE%3A",   // + SYMBOL.P (perpetual), opened in a new tab
  ws: "wss://fstream.binance.com/market/stream",   // live price: one 1m kline stream per symbol, nothing else
  api: "https://fapi.binance.com/fapi/v1/klines",   // REST: history only, synced every 15 minutes
  syncMs: 9e5,          // 15 minutes, aligned to :00 :15 :30 :45
  syncDelay: 3000,      // wait after the boundary so the exchange has closed the candle
  timeoutMs: 15000,
  ivs: ["1d","4h","1h","15m"],                      // RSI / MACD / trend are calculated for all of these
  bars: { "1d":150, "4h":200, "1h":300, "15m":300 },// closed candles of history per interval
  barsDerived: { "1d":100, "4h":150, "1h":200, "15m":300 },// when candles are built from a smaller base (e.g. Nepal days from 15m): less history, far fewer calls
  minBars: 90,          // fewer candles than this: indicators stay blank
  cap: 400,
  rsiLen: 14, adxLen: 14, macd: [12,26,9], adxMin: 20,
  /* previous candle colour -> what a break of its high ("up") / low ("down") means: "buy", "sell" or "" */
  rules: { green: { up:"sell", down:"buy" }, red: { up:"sell", down:"buy" } }
};
/* fixed UTC offsets in minutes (no daylight saving). A zone's candles open at its local midnight */
const TZS = [
  { id:"utc",  label:"UTC (UTC+0)",                 off:0 },
  { id:"np",   label:"Nepal (UTC+5:45)",            off:345 },
  { id:"asia", label:"Asia, SG / HK (UTC+8)",       off:480 },
  { id:"eu",   label:"Europe, CET (UTC+1)",         off:60 },
  { id:"us",   label:"America, New York (UTC-5)",   off:-300 }
];
const IVS = {
  "1d":  { prev:"Yesterday",   cur:"Today",       p:"yesterday's", c:"today's" },
  "4h":  { prev:"Previous 4h", cur:"Current 4h",  p:"previous 4h", c:"current 4h" },
  "1h":  { prev:"Previous 1h", cur:"Current 1h",  p:"previous 1h", c:"current 1h" },
  "15m": { prev:"Previous 15m",cur:"Current 15m", p:"previous 15m",c:"current 15m" }
};
const MS = { "1d":864e5, "4h":144e5, "1h":36e5, "15m":9e5 };
const $ = id => document.getElementById(id);
const ST = {};
let soundOn = false, iv = IVS[CFG.interval] ? CFG.interval : "1d", tz = TZS[0];
const TZK = "candle.tz.v1", LVK = "candle.levels.v1", LOGK = "candle.alerts.v1", LOG_MAX = 50;
try{ tz = TZS.find(z => z.id === localStorage.getItem(TZK)) || TZS[0]; }catch(e){}
const off = () => tz.off * 6e4;

let levels = {};
try{ levels = JSON.parse(localStorage.getItem(LVK)) || {}; }catch(e){ levels = {}; }
const saveLevels = () => { try{ localStorage.setItem(LVK, JSON.stringify(levels)); }catch(e){} };
function level(sym, kind){
  const v = parseFloat((levels[sym] || {})[kind]);
  return Number.isFinite(v) && v > 0 ? v : null;
}

/* ---------- time helpers (all in the selected zone) ---------- */
const pad = n => String(n).padStart(2, "0");
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const hms = t => { const d = new Date(t + off()); return pad(d.getUTCHours()) + ":" + pad(d.getUTCMinutes()) + ":" + pad(d.getUTCSeconds()); };
const hm = t => hms(t).slice(0, 5);
function stamp(ms){
  const d = new Date(ms + off()), n = new Date(Date.now() + off());
  const same = d.getUTCFullYear() === n.getUTCFullYear() && d.getUTCMonth() === n.getUTCMonth() && d.getUTCDate() === n.getUTCDate();
  return (same ? "" : MON[d.getUTCMonth()] + " " + d.getUTCDate() + " ") + hms(ms);
}

/* ---------- alert log ---------- */
let alerts = [];
try{ const a = JSON.parse(localStorage.getItem(LOGK)); if(Array.isArray(a)) alerts = a.slice(0, LOG_MAX); }catch(e){}
const saveAlerts = () => { try{ localStorage.setItem(LOGK, JSON.stringify(alerts)); }catch(e){} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function renderLog(){
  $("log").innerHTML = alerts.length
    ? alerts.map(a => `<li><time>${stamp(a.t)}</time><span class="${a.up ? "pos" : "neg"}">${a.up ? "▲" : "▼"}</span> ${esc(a.msg)}</li>`).join("")
    : `<li class="empty">No alerts yet.</li>`;
}
function addAlert(up, msg){
  alerts.unshift({ t: Date.now(), up, msg });
  if(alerts.length > LOG_MAX) alerts.length = LOG_MAX;
  saveAlerts(); renderLog();
}
$("clearLog").addEventListener("click", () => { alerts = []; saveAlerts(); renderLog(); });
renderLog();

/* ---------- table ---------- */
function levelInput(sym, kind, label){
  const saved = (levels[sym] || {})[kind];
  const v = saved === undefined ? "" : String(saved).replace(/"/g, "&quot;");
  return `<label class="lvrow ${kind === "r" ? "res" : "sup"}"><span class="tag">${kind === "r" ? "R" : "S"}</span><input class="lvl" type="number" step="any" min="0" inputmode="decimal"
    data-sym="${sym}" data-kind="${kind}" placeholder="${label}" aria-label="${sym.replace("USDT","")} ${label.toLowerCase()}" value="${v}"></label>`;
}
const newState = () => ({ b:{}, c:{}, ind:{}, tr:{}, price:null, up:false, down:false, seeded:false, curT:null, aboveR:null, belowS:null,
  upAt:null, dnAt:null, bf:false, buyM:false, sellM:false, sig:"", drawn:0, li:0, bad:false });
CFG.symbols.forEach(s => ST[s] = newState());
$("rows").innerHTML = CFG.symbols.map(s =>
  `<tr id="r-${s}"><td class="sym"><div><a href="${CFG.chart}${s}.P" target="_blank" rel="noopener noreferrer" title="Open ${s}.P on TradingView">${s.replace("USDT","")}<span class="lv">/USDT</span></a></div>
   <div class="price">–</div><div class="status"><span class="badge">Loading</span></div></td>
   <td>–</td><td>–</td><td class="trend"></td><td class="rsi"></td><td class="macd"></td>
   <td class="levels">${levelInput(s,"r","Resistance")}${levelInput(s,"s","Support")}</td></tr>`
).join("");

$("rows").addEventListener("input", e => {
  const t = e.target;
  if(!t.classList.contains("lvl")) return;
  const sym = t.dataset.sym, kind = t.dataset.kind;
  const o = levels[sym] || (levels[sym] = {});
  if(t.value === "") delete o[kind]; else o[kind] = t.value;
  if(!Object.keys(o).length) delete levels[sym];
  saveLevels();
  if(kind === "s") ST[sym].belowS = null; else ST[sym].aboveR = null;
  styleLevels(sym);
});
$("resetLevels").addEventListener("click", () => {
  if(!Object.keys(levels).length) return;
  if(!confirm("Clear all support and resistance values?")) return;
  levels = {}; saveLevels();
  document.querySelectorAll("input.lvl").forEach(i => { i.value = ""; i.classList.remove("hit-up","hit-dn"); });
  for(const sym in ST) ST[sym].aboveR = ST[sym].belowS = null;
});

const fmt = v => v >= 1000 ? v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}) : v >= 1 ? v.toFixed(4) : v.toFixed(6);
const candle = k => ({ t:+k[0], o:+k[1], h:+k[2], l:+k[3], c:+k[4] });
const sleep = ms => new Promise(r => setTimeout(r, ms));

function candleCell(c, hitUp, hitDn, upAt, dnAt){
  const green = c.c >= c.o;
  const at = (hit, t, dir) => hit
    ? `<span class="at ${dir}" title="First 1m candle that traded ${dir === "up" ? "above the previous high" : "below the previous low"}">${dir === "up" ? "▲" : "▼"} ${t ? hm(t) : "…"}</span>` : "";
  return `<div class="lab ${green ? "g" : "r"}"><i class="dot"></i><span>${green ? "Green" : "Red"}</span></div>
    <div class="lv">High <b class="${hitUp ? "hit-up" : ""}">${fmt(c.h)}</b>${at(hitUp, upAt, "up")}</div>
    <div class="lv">Low <b class="${hitDn ? "hit-dn" : ""}">${fmt(c.l)}</b>${at(hitDn, dnAt, "dn")}</div>`;
}
function styleLevels(sym){
  const s = ST[sym], row = $("r-" + sym);
  const iS = row.querySelector('input[data-kind="s"]'), iR = row.querySelector('input[data-kind="r"]');
  const S = level(sym, "s"), R = level(sym, "r"), p = s.price;
  iS.classList.toggle("hit-dn", p != null && S != null && p < S);
  iR.classList.toggle("hit-up", p != null && R != null && p > R);
}

/* ---------- candles ---------- */
/* the base interval a candle of interval i is built from: the largest Binance interval that divides i
   and lines up with the zone's midnight (so UTC reads exchange candles directly, Nepal builds from 15m) */
const baseFor = i => ["1d","4h","1h","15m"].find(b => MS[i] % MS[b] === 0 && off() % MS[b] === 0);
const startOf = (t, i) => Math.floor((t + off()) / MS[i]) * MS[i] - off();
function needs(){
  const n = {};
  for(const i of CFG.ivs){ const b = baseFor(i), bars = (b === i ? CFG.bars : CFG.barsDerived)[i]; n[b] = Math.max(n[b] || 0, Math.ceil((bars + 2) * MS[i] / MS[b])); }
  return n;
}
function agg(bs, i){
  const out = []; let cur = null;
  for(const b of bs){
    const t = startOf(b.t, i);
    if(!cur || cur.t !== t){ cur = { t, o:b.o, h:b.h, l:b.l, c:b.c }; out.push(cur); }
    else { if(b.h > cur.h) cur.h = b.h; if(b.l < cur.l) cur.l = b.l; cur.c = b.c; }
  }
  if(out.length && bs.length && out[0].t !== bs[0].t) out.shift();   // first candle only partly covered
  return out.slice(-CFG.cap);
}
/* websocket 1m tick -> every running candle (t = open time of that 1m candle) */
function feed(s, t, o, h, l, c){
  for(const i of CFG.ivs){
    const a = s.c[i]; if(!a || !a.length) continue;
    const x = a[a.length - 1];
    if(t >= x.t + MS[i]){ a.push({ t: startOf(t, i), o, h, l, c }); if(a.length > CFG.cap) a.shift(); }
    else if(t >= x.t){ if(h > x.h) x.h = h; if(l < x.l) x.l = l; x.c = c; }
  }
  s.price = c;
}
function rebuild(sym){
  const s = ST[sym];
  for(const i of CFG.ivs){
    const e = s.b[baseFor(i)];
    s.c[i] = e && e.a.length ? agg(e.a, i) : null;
  }
  const n = Date.now();
  if(s.price != null) feed(s, n - n % 6e4, s.price, s.price, s.price, s.price);
  inds(sym, true);
  evaluate(sym, null);
}

/* ---------- REST: one queue, paced by request weight, ban aware (history only) ---------- */
let banUntil = 0;
const banned = () => Date.now() < banUntil;
const retryIn = () => Math.max(5000, banUntil - Date.now() + 1500);
async function getKlines(sym, i, limit, extra){
  if(banned()) throw new Error("banned");
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), CFG.timeoutMs);
  try{
    const r = await fetch(`${CFG.api}?symbol=${sym}&interval=${i}&limit=${limit}${extra || ""}`, { signal: ctl.signal });
    const d = await r.json().catch(() => null);
    if(r.status === 418 || r.status === 429){
      const m = /banned until (\d+)/.exec(d && d.msg || "");
      banUntil = m ? +m[1] : Date.now() + (+r.headers.get("retry-after") || 60) * 1000;
      throw new Error("banned");
    }
    if(!Array.isArray(d)) throw new Error(d && d.msg ? d.msg : "Bad response");
    return d;
  } finally { clearTimeout(tm); }
}
/* parallel requests, paced by a weight budget per minute (Binance allows 2400) */
const MAXC = 6, BUDGET = 2000;
let active = 0, wq = [], spent = [];
function pump(){
  while(active < MAXC && wq.length){
    const n = Date.now();
    while(spent.length && n - spent[0][0] > 6e4) spent.shift();
    const used = spent.reduce((a, x) => a + x[1], 0), j = wq[0];
    if(used + j.w > BUDGET){ setTimeout(pump, Math.max(50, spent[0][0] + 6e4 - n + 20)); return; }
    wq.shift(); spent.push([n, j.w]); active++;
    getKlines(j.sym, j.i, j.limit, j.extra).then(j.res, j.rej).finally(() => { active--; pump(); });
  }
}
function rest(sym, i, limit, extra){
  const w = limit < 100 ? 1 : limit < 500 ? 2 : limit <= 1000 ? 5 : 10;
  return new Promise((res, rej) => { wq.push({ sym, i, limit, extra, w, res, rej }); pump(); });
}
/* history in fixed time windows, so all pages download at the same time */
async function history(sym, b, need){
  const m = new Map(), jobs = [];
  let end = Date.now();
  for(let left = need; left > 0;){
    const w = Math.min(1400, left), start = end - w * MS[b];
    jobs.push(rest(sym, b, w + 1, `&startTime=${start}&endTime=${end}`));
    end = start - 1; left -= w;
  }
  for(const k of await Promise.all(jobs)) for(const x of k) m.set(+x[0], candle(x));
  return [...m.values()].sort((x, y) => x.t - y.t);
}
/* first time: full history. afterwards: only the candles since the last stored one */
async function ensure(sym, b, need){
  const s = ST[sym], e = s.b[b], n = Date.now();
  if(e && e.full && e.need >= need && n - e.a[e.a.length - 1].t < 1400 * MS[b]){
    const last = e.a[e.a.length - 1].t;
    const k = (await rest(sym, b, Math.ceil((n - last) / MS[b]) + 2, `&startTime=${last}`)).map(candle);
    const m = new Map(e.a.map(x => [x.t, x]));
    k.forEach(x => m.set(x.t, x));
    e.a = [...m.values()].sort((x, y) => x.t - y.t).slice(-(need + 50));
  } else s.b[b] = { a: await history(sym, b, need), full: true, need };
}
function fail(sym, e){
  const m = String(e && e.message || e), bad = /invalid symbol/i.test(m);
  if(bad) ST[sym].bad = true;
  if(bad || !ST[sym].c[iv])
    $("r-" + sym).querySelector(".status").innerHTML = `<span class="badge warn">${bad ? "Not listed on futures" : m === "banned" ? "REST paused (IP ban)" : "Fetch failed, retrying"}</span>`;
}

/* sync: runs at start, after every websocket reconnect, and then every 15 minutes */
let cyc = 0, timer = null, nextSync = 0;
function schedule(ms){ clearTimeout(timer); nextSync = Date.now() + ms; timer = setTimeout(start, ms); }
async function start(){
  const my = ++cyc, dead = () => my !== cyc, need = needs();
  wq.splice(0).forEach(j => j.rej(new Error("cancelled")));
  const syms = CFG.symbols.filter(x => !ST[x].bad);
  let ok = true;
  const err = (sym, e) => { if(dead()) return; ok = false; fail(sym, e); };
  await Promise.all(syms.map(async sym => {      // 1) selected interval first, so every row fills at once
    const s = ST[sym];
    try{
      const b = baseFor(iv);
      if(!s.b[b]){
        const t0 = startOf(Date.now(), iv) - MS[iv];
        const k = await rest(sym, b, Math.min(1500, Math.ceil((Date.now() - t0) / MS[b]) + 2), `&startTime=${t0}`);
        if(dead()) return;
        s.b[b] = { a: k.map(candle), full: false, need: 0 };
      }
      rebuild(sym);
    }catch(e){ err(sym, e); }
  }));
  if(dead()) return;
  await Promise.all(syms.map(async sym => {      // 2) history / updates of all intervals, all symbols in parallel
    try{
      await Promise.all(Object.keys(need).map(b => ensure(sym, b, need[b])));
      if(!dead()) rebuild(sym);
    }catch(e){ err(sym, e); }
  }));
  if(dead()) return;
  const n = CFG.syncMs;
  schedule(banned() ? retryIn() : ok ? n - Date.now() % n + CFG.syncDelay : 30000);
}

/* ---------- alerts ---------- */
function play(id){
  if(!soundOn) return;
  const a = $(id); a.currentTime = 0; a.play().catch(() => {});
}
function notify(sym, side, msg, tag, title){
  const buy = side === "buy";
  play(buy ? "buySound" : "sellSound");
  const row = $("r-" + sym);
  row.classList.remove("flash-up", "flash-dn"); void row.offsetWidth; row.classList.add(buy ? "flash-up" : "flash-dn");
  addAlert(buy, msg);
  if("Notification" in window && Notification.permission === "granted")
    new Notification(title || (buy ? "Buy signal" : "Sell signal"), { body: msg, tag: sym + tag });
}
function alertFor(sym, dir, side, prevGreen, lv, now, at){
  const name = sym.replace("USDT",""), L = IVS[iv], when = at ? ` at ${hm(at)}` : "";
  notify(sym, side, `${name} ${side.toUpperCase()}${when}: ${L.p} candle ${prevGreen ? "green" : "red"}, ` + (dir === "up"
    ? `broke above ${L.p} high ${fmt(lv)} (${L.c} high ${fmt(now)})` : `broke below ${L.p} low ${fmt(lv)} (${L.c} low ${fmt(now)})`), dir + iv);
}
function alertLevel(sym, kind, lvl, price){
  const name = sym.replace("USDT","");
  if(kind === "r") notify(sym, "buy",  `${name} broke above resistance ${fmt(lvl)} (price ${fmt(price)})`, "res", "Breakout");
  else             notify(sym, "sell", `${name} broke below support ${fmt(lvl)} (price ${fmt(price)})`, "sup", "Breakdown");
}

/* tm = open time of the live 1m candle (websocket tick), null = update came from REST */
function evaluate(sym, tm){
  const s = ST[sym], a = s.c[iv];
  if(!a || a.length < 2) return;
  const p = a[a.length - 2], c = a[a.length - 1];
  if(s.curT !== c.t){ s.curT = c.t; s.up = s.down = false; s.upAt = s.dnAt = null; s.bf = false; }   // new candle
  const up = c.h > p.h, dn = c.l < p.l;
  if(tm && up && !s.up && !s.upAt) s.upAt = tm;
  if(tm && dn && !s.down && !s.dnAt) s.dnAt = tm;

  /* previous candle colour picks the rule; running high above previous high -> rule.up, low below previous low -> rule.down.
     each side fires once per candle; the first load, an interval switch and a zone switch stay silent */
  const pg = p.c >= p.o, rule = CFG.rules[pg ? "green" : "red"];
  const sUp = up ? rule.up : "", sDn = dn ? rule.down : "";
  const buyM = sUp === "buy" || sDn === "buy", sellM = sUp === "sell" || sDn === "sell";
  if(sUp && !s.up){ s.up = true; if(s.seeded) alertFor(sym, "up", sUp, pg, p.h, c.h, s.upAt); }
  if(sDn && !s.down){ s.down = true; if(s.seeded) alertFor(sym, "down", sDn, pg, p.l, c.l, s.dnAt); }
  s.seeded = true;
  if(!tm && !s.bf && ((up && !s.upAt) || (dn && !s.dnAt))) backfill(sym);

  /* support / resistance on the websocket price: fire once per crossing, null = not yet seeded */
  const R = level(sym, "r"), S = level(sym, "s"), px = s.price != null ? s.price : c.c;
  if(R !== null){ const above = px > R; if(s.aboveR === false && above) alertLevel(sym, "r", R, px); s.aboveR = above; } else s.aboveR = null;
  if(S !== null){ const below = px < S; if(s.belowS === false && below) alertLevel(sym, "s", S, px); s.belowS = below; } else s.belowS = null;

  const sig = `${buyM}${sellM}${up}${dn}`, changed = sig !== s.sig;
  s.sig = sig; s.buyM = buyM; s.sellM = sellM;
  render(sym, changed || !tm);
}
/* a break that already existed at (re)load has no known time: read the 1m candles of the running candle once */
async function backfill(sym){
  const s = ST[sym], a = s.c[iv], p = a[a.length - 2], t0 = a[a.length - 1].t, my = iv;
  s.bf = true;
  try{
    const k = await rest(sym, "1m", Math.min(1500, Math.ceil(MS[my] / 6e4) + 2), `&startTime=${t0}`);
    const a2 = s.c[iv];
    if(my !== iv || !a2 || a2[a2.length - 1].t !== t0) return;
    s.upAt = s.dnAt = null;
    for(const x of k){
      const t = +x[0];
      if(!s.upAt && +x[2] > p.h) s.upAt = t;
      if(!s.dnAt && +x[3] < p.l) s.dnAt = t;
      if(s.upAt && s.dnAt) break;
    }
    render(sym, true);
  }catch(e){ s.bf = false; }
}
function render(sym, force){
  const s = ST[sym], a = s.c[iv];
  if(!a || a.length < 2) return;
  const n = Date.now();
  if(!force && n - s.drawn < 400) return;      // the stream ticks ~4x a second, the DOM does not need all of them
  s.drawn = n;
  const row = $("r-" + sym), p = a[a.length - 2], c = a[a.length - 1];
  const label = s.buyM && s.sellM ? ["both strong","Buy ▲ + Sell ▼"] : s.buyM ? ["up strong","Buy ▲"] : s.sellM ? ["dn strong","Sell ▼"] : ["","Inside " + IVS[iv].p + " range"];
  row.querySelector(".price").textContent = fmt(c.c);
  row.children[1].innerHTML = candleCell(p, false, false);
  row.children[2].innerHTML = candleCell(c, c.h > p.h, c.l < p.l, s.upAt, s.dnAt);
  row.classList.toggle("m-up", s.buyM);
  row.classList.toggle("m-dn", s.sellM);
  row.querySelector(".status").innerHTML = `<span class="badge ${label[0]}">${label[1]}</span>`;
  styleLevels(sym);
  refreshView();
}

/* ---------- indicators: closes come from the candle list, the running candle's close is the websocket price ---------- */
function dmi(k, n){
  if(k.length < 3 * n) return null;
  let tr = 0, pdm = 0, mdm = 0, adx = 0, cnt = 0, pdi = 0, mdi = 0;
  for(let i = 1; i < k.length; i++){
    const up = k[i].h - k[i-1].h, dn = k[i-1].l - k[i].l;
    const t = Math.max(k[i].h - k[i].l, Math.abs(k[i].h - k[i-1].c), Math.abs(k[i].l - k[i-1].c));
    const p = up > dn && up > 0 ? up : 0, m = dn > up && dn > 0 ? dn : 0;
    if(i <= n){ tr += t; pdm += p; mdm += m; } else { tr += t - tr / n; pdm += p - pdm / n; mdm += m - mdm / n; }
    if(i >= n){
      pdi = tr ? 100 * pdm / tr : 0; mdi = tr ? 100 * mdm / tr : 0;
      const dx = 100 * Math.abs(pdi - mdi) / ((pdi + mdi) || 1);
      if(cnt < n){ adx += dx / n; cnt++; } else adx = (adx * (n - 1) + dx) / n;
    }
  }
  return { adx, pdi, mdi };
}
function rsi(c, n){
  if(c.length <= n) return null;
  let g = 0, l = 0;
  for(let i = 1; i <= n; i++){ const d = c[i] - c[i-1]; if(d > 0) g += d; else l -= d; }
  g /= n; l /= n;
  for(let i = n + 1; i < c.length; i++){
    const d = c[i] - c[i-1];
    g = (g * (n - 1) + (d > 0 ? d : 0)) / n;
    l = (l * (n - 1) + (d < 0 ? -d : 0)) / n;
  }
  return l ? 100 - 100 / (1 + g / l) : (g ? 100 : 50);
}
function ema(a, n){      // seeded with the SMA of the first n values, like TradingView / Binance
  const k = 2 / (n + 1), out = [];
  let e = 0;
  for(let i = 0; i < n; i++) e += a[i] / n;
  for(let i = 0; i < a.length; i++){
    if(i < n - 1){ out.push(NaN); continue; }
    if(i >= n) e += (a[i] - e) * k;
    out.push(e);
  }
  return out;
}
function macd(c){
  const [f, s, g] = CFG.macd;
  if(c.length < s + g) return null;
  const ef = ema(c, f), es = ema(c, s);
  const m = es.map((v, i) => ef[i] - v).slice(s - 1);
  const sg = ema(m, g), i = m.length - 1;
  return { macd: m[i], sig: sg[i], hist: m[i] - sg[i] };
}
function num(v){
  const a = Math.abs(v);
  if(a >= 1000) return v.toLocaleString("en-US", {maximumFractionDigits: 1});
  return v.toFixed(a ? Math.min(10, Math.max(0, 3 - Math.floor(Math.log10(a)))) : 0);
}
function calc(s){
  const o = {}, tr = {};
  for(const i of CFG.ivs){
    const a = s.c[i]; if(!a || a.length < CFG.minBars) continue;
    const cl = a.map(x => x.c);
    o[i] = { rsi: rsi(cl, CFG.rsiLen), macd: macd(cl) };
    const d = dmi(a.slice(0, -1), CFG.adxLen);       // ADX drops the running candle
    if(d) tr[i] = { t: d.adx < CFG.adxMin ? "side" : d.pdi > d.mdi ? "up" : "down", ...d };
  }
  s.ind = o; s.tr = tr;
}
function inds(sym, force){
  const s = ST[sym], n = Date.now();
  if(!force && n - s.li < 1000) return;
  s.li = n; calc(s); drawInds(sym); drawTrend(sym);
}
function drawInds(sym){
  const o = ST[sym].ind, row = $("r-" + sym);
  const dash = i => `<div class="lab flat"><span class="lv">${i}</span><span>–</span></div>`;
  row.querySelector(".rsi").innerHTML = CFG.ivs.map(i => {
    const v = o[i] && o[i].rsi;
    if(v == null) return dash(i);
    const tag = v >= 70 ? " OB" : v <= 30 ? " OS" : "";
    return `<div class="lab${tag ? " ext" : ""}"><span class="lv">${i}</span><span>${v.toFixed(1)}${tag}</span></div>`;
  }).join("");
  row.querySelector(".macd").innerHTML = CFG.ivs.map(i => {
    const m = o[i] && o[i].macd;
    if(!m) return dash(i);
    const up = m.hist >= 0;
    return `<div class="lab ${up ? "g" : "r"}" title="MACD ${num(m.macd)} · Signal ${num(m.sig)} · Histogram ${num(m.hist)}"><span class="lv">${i}</span><span>${num(m.macd)} / ${num(m.sig)} ${up ? "▲" : "▼"}</span></div>`;
  }).join("");
}
const TL = { up: ["g","Uptrend"], down: ["r","Downtrend"], side: ["flat","Sideways"] };
function drawTrend(sym){
  const o = ST[sym].tr;
  $("r-" + sym).querySelector(".trend").innerHTML = CFG.ivs.map(i => {
    const x = o[i];
    if(!x) return `<div class="lab flat"><i class="dot"></i><span class="lv">${i}</span><span>–</span></div>`;
    const [cls, word] = TL[x.t];
    return `<div class="lab ${cls}" title="ADX ${x.adx.toFixed(1)} · +DI ${x.pdi.toFixed(1)} · -DI ${x.mdi.toFixed(1)}"><i class="dot"></i><span class="lv">${i}</span><span>${word}</span></div>`;
  }).join("");
}

/* ---------- websocket: the only source of live price ---------- */
let ws = null, wsGen = 0, wsTry = 0, wsLast = 0, wsSeen = false;
const wsOpen = () => ws && ws.readyState === 1;
function connect(){
  const my = ++wsGen;
  if(ws){ try{ ws.close(); }catch(e){} }
  ws = new WebSocket(CFG.ws);
  ws.onopen = () => {
    if(my !== wsGen) return;
    wsTry = 0;
    ws.send(JSON.stringify({ method: "SUBSCRIBE", params: CFG.symbols.map(s => s.toLowerCase() + "@kline_1m"), id: 1 }));
    if(wsSeen) start();       // after a reconnect, refill whatever was missed
    wsSeen = true;
  };
  ws.onmessage = e => {
    if(my !== wsGen) return;
    wsLast = Date.now();
    let m; try{ m = JSON.parse(e.data); }catch(x){ return; }
    const d = m && m.data;
    if(d && d.e === "kline") onKline(d.s, d.k);
  };
  ws.onclose = () => {
    if(my !== wsGen) return;
    wsTry++;
    setTimeout(() => { if(my === wsGen) connect(); }, Math.min(30000, 1000 * 2 ** Math.min(wsTry, 5)));
  };
  ws.onerror = () => {};
}
function onKline(sym, k){
  const s = ST[sym]; if(!s) return;
  const t = +k.t;
  feed(s, t, +k.o, +k.h, +k.l, +k.c);       // running candles of all four intervals follow the live price
  evaluate(sym, t);
  inds(sym, false);                          // RSI / MACD with the live close, at most once a second per symbol
}

/* ---------- controls ---------- */
$("enableBtn").addEventListener("click", async () => {
  for(const id of ["buySound","sellSound"]){
    const a = $(id); a.muted = true;
    try{ await a.play(); a.pause(); a.currentTime = 0; }catch(e){}
    a.muted = false;
  }
  soundOn = true;
  $("enableBtn").textContent = "Sound enabled";
  $("enableBtn").classList.remove("primary");
  $("testBuy").disabled = $("testSell").disabled = false;
  if("Notification" in window && Notification.permission === "default") Notification.requestPermission();
});
$("testBuy").addEventListener("click", () => play("buySound"));
$("testSell").addEventListener("click", () => play("sellSound"));

function refreshView(){
  const n = document.querySelectorAll("#rows tr.m-up, #rows tr.m-dn").length;
  const on = document.body.classList.contains("only-match"), b = $("viewToggle");
  b.setAttribute("aria-pressed", String(on));
  b.textContent = on ? "Show all" : `View matches (${n})`;
  $("noMatch").hidden = !(on && n === 0);
}
$("viewToggle").addEventListener("click", () => { document.body.classList.toggle("only-match"); refreshView(); });

function applyIv(){
  const L = IVS[iv];
  $("thPrev").textContent = `${L.prev} (closed)`;
  $("thCur").textContent = `${L.cur} (running)`;
  document.querySelectorAll("#intervals button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.iv === iv)));
}
/* interval or zone changed: rebuild every row from the stored candles, silently (a switch never fires an alert) */
function resetView(){
  applyIv();
  for(const sym of CFG.symbols){
    const s = ST[sym], row = $("r-" + sym);
    s.seeded = false; s.curT = null; s.up = s.down = false; s.upAt = s.dnAt = null; s.bf = false; s.sig = ""; s.c = {};
    row.classList.remove("flash-up", "flash-dn", "m-up", "m-dn");
    if(!s.bad){
      row.querySelector(".price").textContent = "–";
      row.children[1].textContent = row.children[2].textContent = "–";
      row.querySelector(".status").innerHTML = `<span class="badge">Loading</span>`;
    }
    rebuild(sym);
  }
  renderLog(); refreshView();
}
$("intervals").addEventListener("click", e => {
  const b = e.target.closest("button[data-iv]");
  if(!b || b.dataset.iv === iv) return;
  iv = b.dataset.iv;
  resetView();
  if(CFG.symbols.some(sym => !ST[sym].bad && !ST[sym].b[baseFor(iv)])) start();
});
$("tz").innerHTML = TZS.map(z => `<option value="${z.id}">${z.label}</option>`).join("");
$("tz").value = tz.id;
$("tz").addEventListener("change", () => {
  tz = TZS.find(z => z.id === $("tz").value) || TZS[0];
  try{ localStorage.setItem(TZK, tz.id); }catch(e){}
  resetView();
  start();                 // loads the base candles this zone needs (Nepal builds days from 15m candles)
});

function setState(){
  const st = $("state"), live = wsOpen(), p = [];
  p.push(live ? `Live price (websocket)${wsLast ? " · last tick " + hms(wsLast) : ""}` : "Stream disconnected, reconnecting…");
  p.push(banned() ? `REST paused until ${hms(banUntil)} (IP ban) · live stream keeps running` : nextSync ? `next API sync ${hm(nextSync)}` : "loading history…");
  if(!soundOn) p.push("sound off");
  st.className = !live || banned() ? "err" : "";
  st.textContent = p.join(" · ");
}
setInterval(setState, 1000);

applyIv();
CFG.symbols.forEach(s => inds(s, true));
connect();
start();
</script>
<div id="world-clock">
  <style>
    #world-clock {
      position: fixed;
      bottom: 10px;
      right: 10px;
      z-index: 1000;
      background: #111827;
      color: #fff;
      padding: 12px 16px;
      border-radius: 12px 0 0 0;
      font-family: Arial, sans-serif;
      box-shadow: 0 0 15px rgba(0,0,0,0.25);
      min-width: 190px;
    }

    #world-clock .clock-title {
      font-size: 11px;
      color: #9ca3af;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #world-clock .clock-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      padding: 5px 0;
      border-bottom: 1px solid #374151;
    }

      border-bottom: none;
    }

    #world-clock .city {
      font-size: 12px;
      color: #d1d5db;
    }

    #world-clock .time {
      font-size: 15px;
      font-weight: bold;
      font-variant-numeric: tabular-nums;
      color: #38bdf8;
    }

    #world-clock .date {
      font-size: 10px;
      color: #9ca3af;
      text-align: right;
    }

    @media (max-width: 600px) {
      #world-clock {
        min-width: 165px;
        padding: 9px 12px;
      }

      #world-clock .time {
        font-size: 13px;
      }
    }
  </style>

  <div class="clock-title">🌍 World Market Clock</div>

  <div id="clock-list"></div>

  <script>
    (function () {
      const zones = [
        { name: "UTC", zone: "UTC" },
        { name: "Nepal", zone: "Asia/Kathmandu" },
        { name: "Asia / SG / HK", zone: "Asia/Singapore" },
        { name: "Europe / CET", zone: "Europe/Paris" },
        { name: "New York", zone: "America/New_York" }
      ];

      const container = document.getElementById("clock-list");

      zones.forEach((item, index) => {
        container.innerHTML += `
          <div class="clock-row">
            <div>
              <div class="city">${item.name}</div>
              <div class="date" id="date-${index}"></div>
            </div>
            <div class="time" id="time-${index}">--:--:--</div>
          </div>
        `;
      });

      function updateClocks() {
        const now = new Date();

        zones.forEach((item, index) => {
          const time = new Intl.DateTimeFormat("en-GB", {
            timeZone: item.zone,
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false
          }).format(now);

          const date = new Intl.DateTimeFormat("en-GB", {
            timeZone: item.zone,
            day: "2-digit",
            month: "short",
            year: "numeric"
          }).format(now);

          document.getElementById(`time-${index}`).textContent = time;
          document.getElementById(`date-${index}`).textContent = date;
        });
      }

      updateClocks();
      setInterval(updateClocks, 1000);
    })();
  </script>
</div>
