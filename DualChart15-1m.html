<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png"
      href="https://cdn-icons-png.flaticon.com/512/8068/8068073.png">
<title>DualChart15-1m</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #131722;
    color: white;
    font-family: Arial, sans-serif;
}

/* Header: mode controls + pair buttons */
.topbar {
    width: 100%;
    padding: 6px 3px;
    background: #1e222d;
    border-bottom: 1px solid #363c4e;
    display: flex;
    align-items: flex-start;
    gap: 8px;
}

.controls {
    display: flex;
    gap: 5px;
    flex: 0 0 auto;
}

.pair-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 2px;
    flex: 1 1 0;
    min-width: 0;
}

.pair-btn,
.mode-btn,
.slot-chip {
    padding: 7px 10px;
    border: 1px solid #363c4e;
    border-radius: 4px;
    background: #131722;
    color: #d1d4dc;
    cursor: pointer;
    font-size: 12px;
    font-weight: bold;
}

.pair-btn:hover,
.mode-btn:hover {
    border-color: #2962ff;
}

.slot-chip:hover {
    background: #2a2e39;
}

.pair-btn.active {
    background: #2962ff;
    border-color: #2962ff;
    color: white;
}

.pair-btn.active-b {
    background: #ff9800;
    border-color: #ff9800;
    color: #131722;
}

.mode-btn.on {
    background: #26a69a;
    border-color: #26a69a;
    color: #131722;
}

/* Slot selector (visible only in 2-pair mode) */
.slot-bar {
    display: flex;
    gap: 5px;
}

.slot-bar[hidden] {
    display: none;
}

.slot-chip.a { border-left: 4px solid #2962ff; }
.slot-chip.b { border-left: 4px solid #ff9800; }

.slot-chip.target {
    background: #2a2e39;
    color: white;
    box-shadow: inset 0 0 0 1px #d1d4dc;
}

/* Chart layout: one row per pair, 15m left + 1m right */
.dashboard {
    --dash-h: calc(100dvh - var(--topbar-height, 60px));
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr;
    gap: 3px;
    width: 100%;
    height: var(--dash-h);
    padding: 3px;
}

.dashboard.dual {
    grid-template-rows: 1fr 1fr;
}

.dashboard:not(.dual) .chart-box.b {
    display: none;
}

.chart-box {
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
}

.chart-container {
    width: 100%;
    height: 100%;
}

.tradingview-widget-container,
.tradingview-widget-container__widget {
    width: 100%;
    height: 100%;
}

/* Mobile layout */
@media (max-width: 768px) {
    .topbar {
        flex-wrap: wrap;
    }

    .pair-buttons {
        flex: 1 1 100%;
    }

    .pair-btn,
    .mode-btn,
    .slot-chip {
        padding: 6px 8px;
    }

    .dashboard {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
    }

    /* 4 charts: each pair gets one screen height, scroll to see pair B */
    .dashboard.dual {
        grid-template-rows: repeat(4, calc(var(--dash-h) / 2));
        overflow-y: auto;
    }
}
</style>
</head>

<body>
<div id="floatingButtons">
<style>
#floatingButtons{position:fixed;bottom:2px;right:350px;z-index:99999;display:flex;gap:4px}
#floatingButtons button{width:28px;height:28px;background:#000;color:white;border:1px solid #444;border-radius:4px;cursor:pointer;font-weight:bold}
</style>
<button onclick="window.open('https://nishandangi.github.io/projects/DualChart15-1m','_blank')">+</button>
<button onclick="window.open('https://nishandangi.github.io/projects/quardric1m','_blank')">4</button>
</div>


<header class="topbar">
    <div class="controls">
        <button type="button" id="dualBtn" class="mode-btn" title="Monitor 2 pairs (4 charts)">2 PAIRS</button>

        <div id="slotBar" class="slot-bar" hidden>
            <button type="button" class="slot-chip a" data-slot="A" title="Next pair you click goes to slot A"></button>
            <button type="button" class="slot-chip b" data-slot="B" title="Next pair you click goes to slot B"></button>
        </div>
    </div>

    <nav id="pairButtons" class="pair-buttons"></nav>
</header>

<main class="dashboard" id="dashboard">
    <!-- Pair A -->
    <section class="chart-box a"><div class="chart-container" id="chartA15"></div></section>
    <section class="chart-box a"><div class="chart-container" id="chartA1"></div></section>

    <!-- Pair B (2-pair mode only) -->
    <section class="chart-box b"><div class="chart-container" id="chartB15"></div></section>
    <section class="chart-box b"><div class="chart-container" id="chartB1"></div></section>
</main>


<script>

const CFG = {
    exchange: "BINANCE",

   symbols: [
    "AAVEUSDT",
    "ADAUSDT",
    "AVAXUSDT",
    "BCHUSDT",
    "BNBUSDT",
    "BTCUSDT",
    "BTWUSDT",
    "DOTUSDT",
    "ETCUSDT",
    "ETHUSDT",
    "FILUSDT",
    "HYPEUSDT",
    "LINKUSDT",
    "LTCUSDT",
    "NEARUSDT",
    "SOLUSDT",
    "SUIUSDT",
    "TAOUSDT",
    "TRXUSDT",
    "UNIUSDT",
    "XLMUSDT",
    "XMRUSDT",
    "XRPUSDT",
    "ZECUSDT"
]
};

// App state
// dual   : false = 1 pair (2 charts), true = 2 pairs (4 charts)
// symA   : pair in slot A
// symB   : pair in slot B (used only when dual)
// target : slot that the next pair-button click will fill
const state = {
    dual: false,
    symA: "BTCUSDT",
    symB: null,
    target: "A"
};

const SLOTS = {
    A: ["chartA15", "chartA1"],
    B: ["chartB15", "chartB1"]
};

// What each chart container currently shows (avoids reloading unchanged charts)
const rendered = {};

const pairButtons = document.getElementById("pairButtons");
const dashboard = document.getElementById("dashboard");
const dualBtn = document.getElementById("dualBtn");
const slotBar = document.getElementById("slotBar");
const slotChips = slotBar.querySelectorAll(".slot-chip");

// Short button names
function displayName(symbol) {
    return symbol.replace(/USDT$/i, "");
}

// "btcusdt.p" -> "BTCUSDT" (or null if unknown)
function normalize(raw) {
    if (!raw) return null;
    const symbol = raw.toUpperCase().replace(/\.P$/, "");
    return CFG.symbols.includes(symbol) ? symbol : null;
}

// Read pairs from URL: ?pair=btcusdt.p&pair2=ethusdt.p
function getPairFromUrl() {
    const queryPair = new URLSearchParams(location.search).get("pair");
    const pathMatch = location.pathname.match(/\/pair=([^/]+)/i);

    return queryPair || (pathMatch && pathMatch[1]) || "BTCUSDT.P";
}

function getPair2FromUrl() {
    return new URLSearchParams(location.search).get("pair2");
}

// Update URL
function updateUrl() {
    const url = new URL(location.href);

    url.searchParams.set("pair", state.symA.toLowerCase() + ".p");

    if (state.dual) {
        url.searchParams.set("pair2", state.symB.toLowerCase() + ".p");
    } else {
        url.searchParams.delete("pair2");
    }

    history.pushState({ pair: state.symA, pair2: state.dual ? state.symB : null }, "", url);
}

// Render TradingView chart (symbol = null clears the container)
function renderChart(containerId, symbol, interval, force) {

    if (!force && rendered[containerId] === symbol) return;
    rendered[containerId] = symbol;

    const container = document.getElementById(containerId);

    container.innerHTML = "";

    if (!symbol) return;

    const widgetContainer = document.createElement("div");
    widgetContainer.className = "tradingview-widget-container";
    widgetContainer.style.width = "100%";
    widgetContainer.style.height = "100%";

    const widget = document.createElement("div");
    widget.className = "tradingview-widget-container__widget";

    widgetContainer.appendChild(widget);

    const script = document.createElement("script");
    script.type = "text/javascript";
    script.async = true;
    script.src =
        "https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js";

    script.textContent = JSON.stringify({
        autosize: true,
        symbol: `${CFG.exchange}:${symbol}.P`,
        interval: interval,
        timezone: "Etc/UTC",
        theme: "dark",
        style: "1",
        locale: "en",
        allow_symbol_change: true,
        hide_side_toolbar: false,
        hide_top_toolbar: false,
        hide_legend: false,
        hide_volume: false,
        withdateranges: true,
        save_image: true,
        support_host: "https://www.tradingview.com"
    });

    widgetContainer.appendChild(script);
    container.appendChild(widgetContainer);
}

// Symbol shown in a slot (B is empty unless 2-pair mode is on)
function slotSymbol(slot) {
    if (slot === "A") return state.symA;
    return state.dual ? state.symB : null;
}

// Each pair = 15m chart + 1m chart
function renderSlot(slot, force) {
    const symbol = slotSymbol(slot);

    renderChart(SLOTS[slot][0], symbol, "15", force);
    renderChart(SLOTS[slot][1], symbol, "1", force);
}

// Sync the whole UI with `state`
function applyState(forceSlots = []) {

    // layout first, so new charts get their real size
    dashboard.classList.toggle("dual", state.dual);

    dualBtn.classList.toggle("on", state.dual);
    dualBtn.textContent = state.dual ? "2 PAIRS: ON" : "2 PAIRS";

    slotBar.hidden = !state.dual;

    slotChips.forEach(chip => {
        const slot = chip.dataset.slot;
        const symbol = slot === "A" ? state.symA : state.symB;

        chip.textContent = `${slot}: ${symbol ? displayName(symbol) : "-"}`;
        chip.classList.toggle("target", state.dual && state.target === slot);
    });

    document.querySelectorAll(".pair-btn").forEach(button => {
        const symbol = button.dataset.symbol;

        button.classList.toggle("active", symbol === state.symA);
        button.classList.toggle("active-b", state.dual && symbol === state.symB);
    });

    renderSlot("A", forceSlots.includes("A"));
    renderSlot("B", forceSlots.includes("B"));

    updateDashboardHeight();
}

// Select trading pair (fills slot A, or the target slot in 2-pair mode)
function selectPair(symbol, changeUrl = true) {

    if (!CFG.symbols.includes(symbol)) return;

    if (!state.dual) {
        state.symA = symbol;
        applyState(["A"]);
    } else {
        const slot = state.target;
        const otherSlot = slot === "A" ? "B" : "A";
        const key = s => (s === "A" ? "symA" : "symB");

        if (symbol === state[key(otherSlot)]) {
            // Pair already in the other slot -> swap the two slots
            state[key(otherSlot)] = state[key(slot)];
            state[key(slot)] = symbol;
            applyState(["A", "B"]);
        } else {
            state[key(slot)] = symbol;
            applyState([slot]);
        }
    }

    if (changeUrl) {
        updateUrl();
    }
}

// Switch between 1-pair and 2-pair monitor mode
function toggleDual() {

    if (!state.dual) {
        // Pair B: remembered one, otherwise the next pair in the list
        if (!state.symB || state.symB === state.symA) {
            const index = CFG.symbols.indexOf(state.symA);
            state.symB = CFG.symbols[(index + 1) % CFG.symbols.length];
        }

        state.dual = true;
        state.target = "B"; // next pair-button click picks the 2nd pair
    } else {
        state.dual = false;
        state.target = "A";
    }

    applyState();
    updateUrl();
}

// Read state from URL (page load + back/forward)
function loadStateFromUrl() {
    state.symA = normalize(getPairFromUrl()) || "BTCUSDT";

    const pair2 = normalize(getPair2FromUrl());

    if (pair2 && pair2 !== state.symA) {
        state.symB = pair2;
        state.dual = true;
    } else {
        state.dual = false;
    }

    if (!state.dual) {
        state.target = "A";
    }
}

// Generate buttons
CFG.symbols.forEach(symbol => {

    const button = document.createElement("button");

    button.type = "button";
    button.className = "pair-btn";
    button.textContent = displayName(symbol);
    button.dataset.symbol = symbol;
    button.title = `${CFG.exchange}:${symbol}.P`;

    button.addEventListener("click", () => {
        selectPair(symbol);
    });

    pairButtons.appendChild(button);
});

// 2-pair toggle
dualBtn.addEventListener("click", toggleDual);

// Slot chips: choose which slot the next pair click fills
slotChips.forEach(chip => {
    chip.addEventListener("click", () => {
        state.target = chip.dataset.slot;
        applyState();
    });
});

// Dynamically calculate chart height
function updateDashboardHeight() {

    const topbar = document.querySelector(".topbar");

    document.documentElement.style.setProperty(
        "--topbar-height",
        `${topbar.getBoundingClientRect().height}px`
    );
}

window.addEventListener("resize", updateDashboardHeight);

if (window.ResizeObserver) {
    new ResizeObserver(updateDashboardHeight).observe(document.querySelector(".topbar"));
}

// Browser back/forward navigation
window.addEventListener("popstate", () => {
    loadStateFromUrl();
    applyState();
});

// Load initial state
loadStateFromUrl();
updateDashboardHeight();
applyState(["A", "B"]);

</script>

</body>
</html>
